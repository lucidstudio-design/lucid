<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucid film</title>
<style>
  html,body{margin:0;height:100%;background:#10141c;overflow:hidden}
  .stage{position:fixed;inset:0}
  .stage img{position:absolute;inset:-7%;width:114%;height:114%;object-fit:cover;
    animation:kb 16s ease-in-out infinite alternate;will-change:transform}
  .grain{position:absolute;inset:0;pointer-events:none;background:
    linear-gradient(180deg,rgba(0,0,0,.18),transparent 28%,transparent 72%,rgba(0,0,0,.30))}
  .sweep{position:absolute;top:-20%;bottom:-20%;left:0;width:42%;pointer-events:none;
    transform:skewX(-14deg) translateX(-180%);
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.14) 50%,transparent);
    animation:sw 7s ease-in-out infinite}
  @keyframes kb{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.13) translate(-2.5%,-2%)}}
  @keyframes sw{0%{transform:skewX(-14deg) translateX(-180%)}100%{transform:skewX(-14deg) translateX(380%)}}
  @media (prefers-reduced-motion:reduce){.stage img{animation:none}.sweep{display:none}}
</style></head>
<body><div class="stage"><img src="../assets/abimerhi.png" alt=""><div class="grain"></div><div class="sweep"></div></div></body></html>
